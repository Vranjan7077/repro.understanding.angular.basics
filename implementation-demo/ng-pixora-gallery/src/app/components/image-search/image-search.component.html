<form class="search-form" (ngSubmit)="search()">
  <input
    type="search"
    name="searchTerm"
    placeholder="Search nature, cars, cities..."
    [(ngModel)]="searchTerm"
    [disabled]="isLoading"
  />

  <button type="submit" [disabled]="isLoading">Search</button>
  <button
    type="button"
    class="secondary"
    (click)="reset()"
    [disabled]="isLoading"
  >
    Reset
  </button>
</form>
